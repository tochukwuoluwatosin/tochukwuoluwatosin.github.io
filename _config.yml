# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # Options: "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Tochukwu Oluwatosin Maduka, PhD Candidate"
title_separator          : "-"
name                     : &name "Tochukwu Oluwatosin Maduka"
description              : &description "Tochukwu Oluwatosin Maduka- PhD Candidate in Materials Science portfolio and research site"
url                      : "https://tochukwuoluwatosin.github.io"
baseurl                  : ""
repository               : "tochukwuoluwatosin/tochukwuoluwatosin.github.io"

# Site Author - Sidebar Details
author:
  # Biographic information
  avatar           : "profile.png" # You can upload a headshot with this filename later
  name             : "Tochukwu Oluwatosin Maduka"
  pronouns         : "he/him"  
  bio              : "PhD Candidate in Materials Science (Graduating Sept 2026). Researching advanced materials, characterization, and synthesis."
  location         : "Saitama University / Saitama"
  employer         : "Department of Materials Science"
  uri              : # Optional personal link
  email            : "tochukwumaduka.edu@gmail.com" # Replace with your real email

  # Academic profile links (Paste your actual URLs inside quotes if you have them)
  googlescholar    : "" # e.g. "https://scholar.google.com/citations?user=..."
  orcid            : "" # e.g. "https://orcid.org/0000-0000-0000-0000"
  researchgate     : "" # e.g. "https://www.researchgate.net/profile/..."
  scopus           : ""

  # Code and professional networks
  github           : "tochukwuoluwatosin"
  linkedin         : "" # e.g. "in/your-linkedin-id"
  twitter          : "" # Optional X / Twitter handle

# Publication Categories
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true

# System & Engine Settings
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
